<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-label="Klares Aquarell-Spielbrett mit einem eindeutigen Weg von Start zu Ziel">
  <defs>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#4b321d" flood-opacity="0.18"/>
    </filter>
    <filter id="paperNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.034" numOctaves="3" seed="14"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <pattern id="tileGrain" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M8 18 C20 10 31 27 44 14 M12 48 C26 35 39 54 56 42" fill="none" stroke="#6c4b2a" stroke-width="2" opacity="0.08"/>
      <circle cx="15" cy="34" r="2" fill="#6c4b2a" opacity="0.08"/>
      <circle cx="47" cy="27" r="1.8" fill="#fff5d8" opacity="0.3"/>
    </pattern>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5e5bf"/>
      <stop offset="0.55" stop-color="#e9cf98"/>
      <stop offset="1" stop-color="#d3a96b"/>
    </linearGradient>
    <linearGradient id="pathPaint" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff2cf"/>
      <stop offset="0.55" stop-color="#f0d9a5"/>
      <stop offset="1" stop-color="#d9b676"/>
    </linearGradient>
    <symbol id="fieldTile" viewBox="-50 -32 100 64">
      <rect x="-47" y="-27" width="94" height="54" rx="15" fill="#5d4028" opacity="0.15" transform="translate(0 8)"/>
      <rect class="tile-fill" x="-44" y="-26" width="88" height="52" rx="15" fill="currentColor"/>
      <rect x="-44" y="-26" width="88" height="52" rx="15" fill="url(#tileGrain)" opacity="0.46"/>
      <path d="M-35 -13 C-14 -23 18 -22 36 -11" fill="none" stroke="#fff6dd" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
      <rect x="-44" y="-26" width="88" height="52" rx="15" fill="none" stroke="#fff7df" stroke-width="6"/>
      <rect x="-40" y="-22" width="80" height="44" rx="12" fill="none" stroke="#7d5431" stroke-width="1.4" opacity="0.22"/>
    </symbol>
    <marker id="arrow" markerWidth="15" markerHeight="15" refX="11" refY="7.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L13 7.5 L1 14 Z" fill="#6f4a2a" opacity="0.7"/>
    </marker>
    <style>
      .field { filter: url(#softShadow); }
      .field text { fill: #352418; font-family: Avenir Next, Segoe UI, sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 0; paint-order: stroke; stroke: rgba(255,248,226,.7); stroke-width: 3px; }
      .field.start text, .field.finish text { font-size: 16px; }
      .nomen { color: #bd604b; }
      .verben { color: #7f946a; }
      .adjektiv { color: #557585; }
      .helper { color: #d9a33d; }
      .movement { color: #cf8f45; }
      .trap { color: #9d554f; }
      .reward { color: #d6a43d; }
      .portal { color: #9b6780; }
      .start { color: #8ea06f; }
      .finish { color: #e0ad38; }
      .map-copy { font-family: Avenir Next, Segoe UI, sans-serif; font-weight: 950; letter-spacing: .07em; text-transform: uppercase; paint-order: stroke; stroke: rgba(255,248,226,.9); stroke-width: 5px; }
    </style>
  </defs>

  <rect width="1672" height="941" fill="url(#paper)"/>
  <rect width="1672" height="941" fill="#f8ecd0" opacity="0.62" filter="url(#paperNoise)"/>

