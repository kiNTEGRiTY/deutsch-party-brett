<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-label="Funktionales Spielbrett mit einem einzigen Weg aus 36 Feldern">
  <defs>
    <filter id="paperNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.032" numOctaves="3" seed="36"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.14"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="softLift" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#4a301d" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6e8c8"/>
      <stop offset="0.56" stop-color="#ecd5a5"/>
      <stop offset="1" stop-color="#d2ab70"/>
    </linearGradient>
    <linearGradient id="routePaint" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff4ce"/>
      <stop offset="0.54" stop-color="#e9c889"/>
      <stop offset="1" stop-color="#b98248"/>
    </linearGradient>
    <pattern id="slotGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M7 18 C20 9 31 26 45 13 M12 47 C26 35 39 53 55 42" fill="none" stroke="#69482b" stroke-width="2" opacity="0.07"/>
      <circle cx="18" cy="35" r="2" fill="#6c4b2b" opacity="0.07"/>
      <circle cx="45" cy="26" r="1.8" fill="#fff6dc" opacity="0.32"/>
    </pattern>
    <symbol id="field-slot" viewBox="-58 -38 116 76">
      <rect x="-52" y="-29" width="104" height="58" rx="18" fill="#65422a" opacity="0.16" transform="translate(0 8)"/>
      <rect x="-52" y="-31" width="104" height="62" rx="18" fill="#f5dfab"/>
      <rect x="-52" y="-31" width="104" height="62" rx="18" fill="url(#slotGrain)" opacity="0.54"/>
      <path d="M-40 -14 C-20 -25 18 -25 40 -13" fill="none" stroke="#fff8df" stroke-width="5" stroke-linecap="round" opacity="0.38"/>
      <rect x="-52" y="-31" width="104" height="62" rx="18" fill="none" stroke="#fff8e3" stroke-width="7"/>
      <rect x="-47" y="-26" width="94" height="52" rx="15" fill="none" stroke="#825a35" stroke-width="1.7" opacity="0.26"/>
    </symbol>
    <marker id="routeArrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L14 8 L2 14 Z" fill="#634126" opacity="0.68"/>
    </marker>
    <style>
      .route-shadow,
      .route-base,
      .route-thread,
      .route-arrow { display: none; }
      .slot { opacity: 0.92; }
      .label { font-family: Avenir Next, Segoe UI, sans-serif; font-weight: 950; letter-spacing: 0; paint-order: stroke; stroke: rgba(255, 248, 226, 0.92); stroke-width: 6px; }
    </style>
  </defs>

