<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="darkreader-lock">
  <meta name="description" content="Deutsch Party Brett - ein lokales Lern-Brettspiel fuer die Grundschule.">
  <meta name="theme-color" content="#ead7b2">
  <title>Deutsch Party Brett</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232d5a48'/%3E%3Cpath d='M13 42C21 24 36 19 52 16' fill='none' stroke='%23f2c15d' stroke-width='8' stroke-linecap='round'/%3E%3Ccircle cx='17' cy='42' r='6' fill='%23f06f57'/%3E%3Ccircle cx='32' cy='29' r='6' fill='%235bbf8d'/%3E%3Ccircle cx='49' cy='17' r='6' fill='%236aa8ff'/%3E%3C/svg%3E">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <script>
    if (window.location.protocol === 'file:') {
      window.location.replace('http://127.0.0.1:4174/?from=file');
    }
  </script>

  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/cardboard-games.css">
  <link rel="stylesheet" href="css/base.css?v=start-live-preview-35">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/screens/start.css?v=start-live-preview-35">
  <link rel="stylesheet" href="css/screens/setup.css?v=start-live-preview-35">
  <link rel="stylesheet" href="css/screens/board.css?v=start-live-preview-35">
  <link rel="stylesheet" href="css/screens/minigame.css?v=start-live-preview-35">
  <link rel="stylesheet" href="css/screens/results.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html,
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color-scheme: only light !important;
      forced-color-adjust: none !important;
      background: #ead7b2 !important;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ead7b2;
    }

    .screen.active {
      display: flex !important;
    }

    #setup-content,
    #board-content,
    #minigame-menu-content,
    #minigame-content,
    #results-content {
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="module" src="js/app.js?v=start-live-preview-35"></script>
</head>
<body>
  <div id="screen-start" class="screen start-screen">
    <main class="start-shell animate-screen" aria-labelledby="start-title">
      <div class="start-art" aria-hidden="true">
        <span class="start-cutout start-cutout--elephant"></span>
        <span class="start-cutout start-cutout--penguin"></span>
        <span class="start-cutout start-cutout--cat"></span>
        <span class="start-cutout start-cutout--dog"></span>
        <span class="start-cutout start-cutout--kangaroo"></span>
        <span class="start-cutout start-cutout--fox"></span>
        <span class="start-cutout start-cutout--deer"></span>
        <div id="start-live-board" class="start-live-board"></div>
      </div>

      <section class="start-copy" aria-label="Spielstart">
        <p class="start-kicker">Aquarell-Edition</p>
        <h1 id="start-title" class="start-title">Deutsch Party Brett</h1>
        <p class="start-subtitle">Ein gemaltes Party-Brettspiel mit Aufgaben, Duellen, Jokern, Bonusfeldern und schnellen Deutschmomenten fuer die ganze Runde.</p>
      </section>

      <section class="start-actions" aria-label="Hauptaktionen">
        <button id="btn-new-game" type="button" class="start-action start-action--primary" data-testid="start-new-game">
          <span>Neue Partie</span>
          <small>Setup, Figuren und Themen</small>
        </button>
        <button id="btn-continue" type="button" class="start-action" data-testid="start-continue">
          <span>Setup oeffnen</span>
          <small>Keine gespeicherte Partie</small>
        </button>
        <button id="btn-minigames" type="button" class="start-action start-action--quiet" data-testid="start-minigames">
          <span>Minispiele</span>
          <small>Direkt in die Aufgaben</small>
        </button>
      </section>

      <aside class="start-moments" aria-label="Spielinhalt">
        <span>Im Brett</span>
        <strong>Wuerfeln · Duell · Teamruf · Joker · Risiko · Finale</strong>
      </aside>
      <div class="start-floating start-floating--one" aria-hidden="true"></div>
      <div class="start-floating start-floating--two" aria-hidden="true"></div>
      <div class="start-floating start-floating--three" aria-hidden="true"></div>
    </main>
  </div>

  <div id="screen-setup" class="screen setup-screen">
    <div id="setup-content"></div>
  </div>

  <div id="screen-board" class="screen board-screen">
    <div id="board-content"></div>
  </div>

  <div id="screen-minigame-menu" class="screen setup-screen">
    <div id="minigame-menu-content"></div>
  </div>

  <div id="screen-minigame" class="screen minigame-screen">
    <div id="minigame-content"></div>
  </div>

  <div id="screen-results" class="screen results-screen">
    <div id="results-content"></div>
  </div>
</body>
</html>
